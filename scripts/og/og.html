@font-face{font-family:'Space Grotesk';src:url(../../site/assets/fonts/space-grotesk-latin.woff2) format('woff2');font-weight:300 700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#f4f1e8;font-family:'Space Grotesk',sans-serif;color:#0b0b0b;padding:36px 44px 46px 36px}
.card{position:relative;width:100%;height:100%;background:#fff;border:3px solid #0b0b0b;border-radius:28px;
      box-shadow:9px 9px 0 #0b0b0b;display:grid;grid-template-columns:1fr 360px;column-gap:24px;padding:46px 40px 40px 52px}
.role{font-size:22px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#4f4a40}
.stmt{font-size:70px;font-weight:700;letter-spacing:-.045em;line-height:1.06;margin-top:22px}
.nw{white-space:nowrap}
.hl{display:inline-block;background:#ff6fae;border:3px solid #0b0b0b;border-radius:18px;padding:0 16px 6px;box-shadow:5px 5px 0 #0b0b0b}
.foot{position:absolute;left:52px;bottom:40px;display:flex;gap:12px;align-items:center}
.name{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-right:8px}
.pill{font-size:19px;font-weight:600;border:2.5px solid #0b0b0b;border-radius:999px;padding:6px 15px;background:#f4f1e8}
.pill.mint{background:#7bffbf}
.pic{position:relative;align-self:center;margin-top:-20px}
.pic .frame{background:#e9e4d4;border:3px solid #0b0b0b;border-radius:22px;box-shadow:6px 6px 0 #0b0b0b;transform:rotate(1.6deg);padding:24px 10px 4px}
.pic svg{display:block;width:100%;height:auto}
.hi{position:absolute;top:-22px;left:18px;z-index:1;background:#fff;border:3px solid #0b0b0b;border-radius:999px;padding:8px 18px;
    font-size:22px;font-weight:700;box-shadow:4px 4px 0 #0b0b0b;transform:none}
.url{position:absolute;right:40px;bottom:46px;font-size:22px;font-weight:600;letter-spacing:.06em;color:#4f4a40}
</style>
</head>
